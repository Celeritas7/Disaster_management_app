name: Disaster Management safety checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free cache and storage tests
        run: node --test tests/phase1s.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium PWA smoke check (no skips allowed)
        env:
          REQUIRE_BROWSER: '1'
        run: node --test tests/browser-smoke.test.mjs
