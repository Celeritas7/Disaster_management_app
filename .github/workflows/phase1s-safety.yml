name: Disaster Management safety and UI checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free cache, storage and UI-contract tests
        run: node --test tests/phase1s.test.mjs tests/phase1a.test.mjs tests/phase1b.test.mjs tests/phase1c.test.mjs tests/phase2a.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium PWA smoke check (no skips allowed)
        env:
          REQUIRE_BROWSER: '1'
        run: node --test tests/browser-smoke.test.mjs
      - name: Run Phase 1A mobile browser checks and capture references
        env:
          REQUIRE_BROWSER: '1'
          DMA_SCREENSHOT_DIR: artifacts/phase1a
        run: node --test tests/phase1a-browser.test.mjs
      - name: Run Phase 1B mobile and offline interaction checks
        env:
          REQUIRE_BROWSER: '1'
          DMA_SCREENSHOT_DIR: artifacts/phase1b
        run: node --test tests/phase1b-browser.test.mjs
      - name: Run Phase 1C Night Out, after-action, log and Settings browser checks
        env:
          REQUIRE_BROWSER: '1'
          DMA_SCREENSHOT_DIR: artifacts/phase1c
        run: node --test tests/phase1c-browser.test.mjs
      - name: Run Phase 2A places, contacts and SMS-confirmation browser checks
        env:
          REQUIRE_BROWSER: '1'
          DMA_SCREENSHOT_DIR: artifacts/phase2a
        run: node --test tests/phase2a-browser.test.mjs
      - name: Save mobile visual-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-mobile-reference
          path: artifacts/phase1a/
          if-no-files-found: ignore
      - name: Save Phase 1B mobile references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-mobile-reference
          path: artifacts/phase1b/
          if-no-files-found: ignore
      - name: Save Phase 1C mobile references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-mobile-reference
          path: artifacts/phase1c/
          if-no-files-found: ignore
      - name: Save Phase 2A mobile references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-mobile-reference
          path: artifacts/phase2a/
          if-no-files-found: ignore
